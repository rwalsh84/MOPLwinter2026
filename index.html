<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bird Survey Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body { margin: 0; }
    #map { height: 100vh; width: 100vw; }
.info-panel {
  background: white;
  padding: 20px;      /* increase padding */
  border-radius: 10px;
  box-shadow: 0 0 12px rgba(0,0,0,0.35);
  max-width: 400px;
  font-family: sans-serif;
  line-height: 1.5;   /* a bit more spacing */
  font-size: 1.4em;   /* scale everything up */
}

.info-title {
  font-size: 22px;    /* was 18px → double */
  font-weight: bold;
  margin-bottom: 12px;
}

.info-text {
  font-size: 18px;    /* was 14px → double */
  margin-bottom: 18px;
}

.info-legend {
  font-size: 14px;    /* legend text bigger */
}

.legend-row {
  display: flex;
  align-items: center;
  margin-bottom: 8px;   /* slightly bigger spacing for bigger font */
}

.legend-box {
  display: inline-block;   /* ensure it renders as a block */
  width: 30px;             /* double previous size */
  height: 30px;
  margin-right: 12px;
  border: 2px solid #555;  /* thicker border to match bigger size */
  flex-shrink: 0;          /* don't shrink when container is narrow */
}

.leaflet-popup-content {
  font-size: 28px;      /* roughly double */
  line-height: 1.5;
}

.leaflet-popup-content table {
  font-size: 28px;      /* if you use a table inside popup */
}
  </style>
</head>

<body>
<div id="map"></div>

<!-- PapaParse for CSV parsing -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // -------------------------------
  // CONFIG
  // -------------------------------

  const sheetCSVUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQAuCYuA2qVCdRemU8gz0XJZNqlvISHcUEARIVddpKJZHlFhnQ_8G6aBfiLNgWJlIOGq7C075smSDDz/pub?output=csv";
  const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSd6e2s8ZoljDQy_Bt31CcI0LjbXRu5j0MhgV1BuqR8CHTP9Vw/formResponse";

  const entryIDs = {
    cell_id: "entry.2123537933",
    PixelName: "entry.1700637740",
    Status: "entry.704542047",
    ClaimerName: "entry.617726333",
    ClaimerEmail: "entry.228419495"
  };

  // -------------------------------
  // INITIALIZE MAP
  // -------------------------------

  const map = L.map('map');

const infoPanel = L.control({ position: "topleft" });

infoPanel.onAdd = function () {
  const div = L.DomUtil.create("div", "info-panel");

  div.innerHTML = `
    <div class="info-title">Mountain Plover Survey Winter 2026</div>
    <div class="info-text">
      Claim 3km x 3km survey blocks by clicking on them and filling out info. Zoom in to inspect. Most are in Central and Southern California. <br><br>
      Questions? <a href="mailto:rwalsh@pointblue.org">rwalsh@pointblue.org</a><br>
<a href="https://docs.google.com/forms/d/e/1FAIpQLSecMJ7c7OuvOcMON64cdeqYUCF2sOrMsDZZk0fI3Ep6X_swxg/viewform" 
   target="_blank" 
   rel="noopener"> <br>
   Return to main data form & instructions <br>

</a>
    </div>
Legend
    <div class="info-legend">
      <div class="legend-row">
        <span class="legend-box" style="background:#D00000;"></span>
        Claimed
      </div>
      <div class="legend-row">
        <span class="legend-box" style="background:#03045E;"></span>
        Higher predicted abundance (priority)
      </div>
      <div class="legend-row">
        <span class="legend-box" style="background:#0077B6;"></span>
        Intermediate predicted abundance
      </div>
      <div class="legend-row">
        <span class="legend-box" style="background:#D3E6FF;"></span>
        Lower predicted abundance
      </div>
    </div>
  `;

  return div;
};

infoPanel.addTo(map);



L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, USGS',
    maxZoom: 19
}).addTo(map);

// Labels overlay
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 20
}).addTo(map);

  let gridLayer;

  // Load GeoJSON
  fetch("survey_grid.geojson")
    .then(res => res.json())
    .then(data => {
      gridLayer = L.geoJSON(data, {
        style: f => ({
          fillColor: f.properties.fillColor,
          color: f.properties.strokeColor,
          weight: 1,
          fillOpacity: 0.6
        }),
        onEachFeature: (feature, layer) => {
          const p = feature.properties;
          const btnId = `claim-${p.cell_id}`;

          layer.bindPopup(generatePopupContent(p, btnId));

          // Attach claim handler
          layer.on("popupopen", () => {
            const btn = document.getElementById(btnId);
            if (!btn) return;
            btn.onclick = () => claimSquare(layer, p.cell_id, p.PixelName);
          });
        }
      }).addTo(map);

      map.fitBounds(gridLayer.getBounds());

      // -------------------------------
      // LOAD EXISTING CLAIMS FROM SHEET
      // -------------------------------
      fetch(sheetCSVUrl)
        .then(r => r.text())
        .then(csvText => {
          const rows = Papa.parse(csvText, { header: true }).data;

          rows.forEach(r => {
            const cellId = r.cell_id;
            const layer = gridLayer.getLayers().find(l => l.feature.properties.cell_id == cellId);
            if (layer && r.Status === "claimed") {
              const p = layer.feature.properties;
              p.Status = "claimed";
              p.ClaimerName = r.ClaimerName;
              p.ClaimerEmail = r.ClaimerEmail;

              layer.setStyle({ fillOpacity: 0.1, opacity: 0.3 });
              layer.setPopupContent(generatePopupContent(p, `claimed-${cellId}`));
            }
          });
        });
    });

  // -------------------------------
  // HELPERS
  // -------------------------------

  function generatePopupContent(p, btnId) {
    const claimed = p.Status === "claimed";
    return `
      <b>Block:</b> ${p.PixelName}<br>
      <b>Cell ID:</b> ${p.cell_id}<br>
      <b>State:</b> ${p.State}<br>
      <b>Nearest city:</b> ${p.NearestCity}<br>
      <b>Distance to city:</b> ${p.DstMiles} miles<br>
      <b>Plover rel. abundance:</b> ${p.RelAbun}<br>
      <b>Status:</b> ${p.Status}<br>
      ${claimed ? `<b>Claimed by:</b> ${p.ClaimerName}<br>` : ""}
      <br>
      <button id="${btnId}" ${claimed ? "disabled" : ""}>Claim this square</button>
    `;
  }

  function claimSquare(layer, cellId, pixelName) {
    const name = prompt("Your name:");
    if (!name) return;

    const email = prompt("Your email:");
    if (!email) return;

    // Update polygon properties in memory
    const p = layer.feature.properties;
    p.Status = "claimed";
    p.ClaimerName = name;
    p.ClaimerEmail = email;

    // Red polygon for claimed
    layer.setStyle({
  fillColor: "#D00000",
  color: "#7A0000",
  fillOpacity: 0.2,
  opacity: 1
});

    // Update popup immediately
    layer.setPopupContent(generatePopupContent(p, `claimed-${cellId}`));
    layer.closePopup();

    // Submit to Google Form
    const data = new FormData();
    data.append(entryIDs.cell_id, cellId);
    data.append(entryIDs.PixelName, pixelName);
    data.append(entryIDs.Status, "claimed");
    data.append(entryIDs.ClaimerName, name);
    data.append(entryIDs.ClaimerEmail, email);

    fetch(formUrl, { method: "POST", body: data })
      .then(() => console.log(`Claim submitted: ${pixelName}`))
      .catch(err => console.error(err));

    alert(`Thanks, ${name}!\nYou claimed ${pixelName}.`);
  }
</script>
</body>
</html>
